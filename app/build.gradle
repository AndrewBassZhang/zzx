plugins {
    id 'com.android.application'
}

android {
    namespace 'com.andrew.note3lanbackup'
    compileSdk 35

    defaultConfig {
        applicationId 'com.andrew.note3lanbackup'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
